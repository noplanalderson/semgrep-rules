rules:
- id: codeigniter3-sql-injection
  languages: [php]
  severity: WARNING
  message: >-
    Terdeteksi penggunaan input pengguna secara langsung dalam query SQL di CodeIgniter 3. 
    Hal ini berpotensi menyebabkan SQL Injection. Gunakan parameter binding atau Query Builder untuk menghindari kerentanan ini.
  metadata:
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    cwe:
    - "CWE-89: SQL Injection"
    category: security
    technology:
    - codeigniter3
    references:
    - https://codeigniter.com/user_guide/database/queries.html
    - https://owasp.org/www-community/attacks/SQL_Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
  mode: taint
  pattern-sources:
    - patterns:
        - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: $this->input->get(...)
          - pattern: $this->input->post(...)
          - pattern: $this->input->request(...)
          - pattern: $this->input->cookie(...)
          - pattern: $this->input->server(...)
          - pattern: $this->input->get_post(...)
  pattern-sinks:
    - patterns:
      - pattern: $SQL
      - pattern-either:
          - pattern-inside: $SQL = "...".$_POST['...']."...";
          - pattern-inside: $SQL = "...".$VAR."...";
          - pattern-inside: $this->db->query($SQL)
          - pattern-inside: $this->db->query("...".$_POST['...']."...")

