rules:
- id: file-upload-without-allowed-types
  languages: [php]
  severity: WARNING
  message: >-
    File upload detected without setting `allowed_types`. 
    Anda sebaiknya membatasi tipe file yang diizinkan agar tidak semua file bisa diunggah (misal: jpg|png|pdf).
  metadata:
    category: security
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    subcategory: [vuln]
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
  patterns:
    - pattern-inside: |
        function $FUNC(...) {
            ...
        }
    - pattern: $this->upload->do_upload(...)
    - pattern-not: |
        $config["allowed_types"] = $ANYTHING;
    - pattern-not: |
        $config['allowed_types'] = $ANYTHING;
- id: file-upload-allowed-types-any
  languages: [php]
  severity: WARNING
  message: >-
    allowed_types diset ke "*", membolehkan upload semua file — ini berisiko.
  metadata:
    category: security
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    subcategory: [vuln]
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
  pattern-either:
    - pattern: $config["allowed_types"] = "*";
    - pattern: $config['allowed_types'] = "*";
- id: file-upload-without-max-size
  languages: [php]
  severity: WARNING
  message: >-
    File upload tidak membatasi ukuran dengan `max_size`. Ini bisa menyebabkan DoS atau penggunaan storage berlebih.
  metadata:
    category: security
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  patterns:
    - pattern-inside: |
        function $FUNC(...) {
            ...
        }
    - pattern: $this->upload->do_upload(...)
    - pattern-not: |
        $config["max_size"] = $ANYTHING;
    - pattern-not: |
        $config['max_size'] = $ANYTHING;
- id: file-upload-without-mime-check
  languages: [php]
  severity: WARNING
  message: >-
    `detect_mime` tidak diaktifkan pada upload file. Ini membuat file palsu seperti .jpg berisi PHP bisa lolos.
  metadata:
    category: security
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    subcategory: [vuln]
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
  patterns:
    - pattern-inside: |
        function $FUNC(...) {
            ...
        }
    - pattern: $this->upload->do_upload(...)
    - pattern-not: |
        $config["detect_mime"] = true;
    - pattern-not: |
        $config['detect_mime'] = true;
