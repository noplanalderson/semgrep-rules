rules:
- id: ci3-upload-missing-allowed-types
  languages: [php]
  severity: WARNING
  message: >
    Fungsi upload file tidak mengatur `allowed_types`. Ini bisa menyebabkan file berbahaya diunggah.
  metadata:
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    subcategory: [vuln]
  pattern: |
    function $FUNC(...) {
      ...
      $this->upload->do_upload(...);
      ...
    }
  pattern-not-inside: |
    function $FUNC(...) {
      ...
      $config["allowed_types"] = $VAL;
      ...
    }

- id: ci3-upload-missing-max-size
  languages: [php]
  severity: WARNING
  message: >
    Fungsi upload file tidak mengatur `max_size`. File sangat besar bisa membebani server.
  metadata:
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    subcategory: [vuln]
  pattern: |
    function $FUNC(...) {
      ...
      $this->upload->do_upload(...);
      ...
    }
  pattern-not-inside: |
    function $FUNC(...) {
      ...
      $config["max_size"] = $VAL;
      ...
    }

- id: ci3-upload-missing-detect-mime
  languages: [php]
  severity: WARNING
  message: >
    Fungsi upload file tidak mengaktifkan `detect_mime`. File PHP berkamuflase bisa lolos upload.
  metadata:
    technology: [codeigniter3]
    cwe: ["CWE-434"]
    subcategory: [vuln]
  pattern: |
    function $FUNC(...) {
      ...
      $this->upload->do_upload(...);
      ...
    }
  pattern-not-inside: |
    function $FUNC(...) {
      ...
      $config["detect_mime"] = true;
      ...
    }